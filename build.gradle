plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version "9.6.1"
    id 'org.openjfx.javafxplugin' version "0.1.0"
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
    implementation 'com.github.oshi:oshi-core:7.8.0'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = '21.0.13.1'
    modules = ['javafx.controls']
}

application {
    // Define the main class for the application.
    mainClass = 'passwordgenerator.Launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('run', JavaExec) {
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        systemProperty 'file.encoding', 'cp866'
    }
}

tasks.named('shadowJar') {
    archiveFileName = 'password-generator-fat.jar'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
