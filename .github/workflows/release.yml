name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.jar }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            jar: password-generator-windows.jar
          - os: ubuntu-latest
            jar: password-generator-linux-x64.jar
          - os: macos-latest
            jar: password-generator-macos.jar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          dependency-graph: generate-and-submit

      - name: Build fat JAR and run tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Rename fat JAR for target platform
        shell: bash
        run: mv build/libs/password-generator-fat.jar "${{ matrix.jar }}"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.jar }}
          path: ${{ matrix.jar }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform JARs
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            password-generator-windows.jar
            password-generator-linux-x64.jar
            password-generator-macos.jar